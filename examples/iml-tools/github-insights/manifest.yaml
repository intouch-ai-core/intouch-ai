  users: [open-source maintainers, developer-relations teams, product managers, software developers]
  fields: [software, devops, marketing, analytics]
  pains:
    - "Who is actually looking at my repository?"
    - "Email me the repository traffic every Monday"
    - "Where is the traffic to our repo coming from?"
    - "Did the launch post move the numbers?"
    - "Keep a traffic history longer than the 14 days GitHub retains"
  generatedBy: hand-written against https://docs.github.com/en/rest/metrics/traffic
